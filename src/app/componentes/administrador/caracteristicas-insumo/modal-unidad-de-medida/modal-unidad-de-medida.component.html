<div class="modal-dialog-scrollable modal-lg">
  <div class="modal-content">
    <div class="app-modal-header  modal-header">
      <!-- tipo modal es la accion de para el modal actualizar o guardar -->
      <h4 class="modal-title tit-modal1">
        <b *ngIf="!editar && !ver">Agregar Unidad de Medida</b>
        <b *ngIf="editar && !ver">Editar Unidad de Medida</b>
        <b *ngIf="ver">Datos Unidad de Medida</b>
      </h4>
      <button type="button" class="close basic-close" (click)="closeModal('click-close')">
        <span aria-hidden="true" class="mt-2">&times;</span>
      </button>
    </div>
    <div class="modal-body">

      <div class="row" *ngIf="ver; else editarGuardar">
        <div class="col-12">
          <label>Activo :</label>
          <div class="switch switch-primary d-inline m-r-10" style="margin-left: 10px;">
            <input type="checkbox" id="switch-p-1" [(ngModel)]='ver_activo' disabled>
            <label for="switch-p-1" class="cr"></label>
          </div>
        </div>
        <label class="col-sm-3 col-form-label">Unidad :</label>
        <div class="col-sm-9">
          <label id="tx_area2" class="col-sm-12 col-form-label"><b>{{datos?.descripcion}}</b></label>
        </div>
        <label class="col-sm-3 col-form-label">Abreviatura :</label>
        <div class="col-sm-9">
          <label id="tx_area2" class="col-sm-12 col-form-label"><b>{{datos?.unidad}}</b></label>
        </div>
        <h4 class="col-12 sub-title h4-grupo"><b>Información Adicional</b></h4>
        <div class="col-12">
          <label>Porcentaje :</label>
          <div class="switch switch-primary d-inline m-r-10" style="margin-left: 10px;">
            <input type="checkbox" id="switch-p-2" [(ngModel)]='ver_porc' disabled>
            <label for="switch-p-2" class="cr"></label>
          </div>
        </div>
        <label class="col-sm-3 col-form-label">Grupo :</label>
        <div class="col-sm-9">
          <label id="tx_area2" class="col-sm-12 col-form-label"><b>{{desc_tipo_insumo}}</b></label>
        </div>
        <label class="col-sm-3 col-form-label">Utilizar en :</label>
        <div class="col-9">
          <section class="example-section">
            <mat-checkbox class="example-margin" [(ngModel)]='verutil1' disabled>MANO DE OBRA</mat-checkbox>
            <mat-checkbox class="example-margin" [(ngModel)]='verutil2' disabled>MATERIALES</mat-checkbox>
            <mat-checkbox class="example-margin" [(ngModel)]='verutil3' disabled>EQUIPO</mat-checkbox>
            <mat-checkbox class="example-margin" [(ngModel)]='verutil4' disabled>SUBCONTRATOS</mat-checkbox>
          </section>
        </div>
        <div class="col-12">
          <label>Agregar Automaticamente :</label>
          <div class="switch switch-primary d-inline m-r-10" style="margin-left: 10px;">
            <input type="checkbox" id="switch-p-3" [(ngModel)]='addauto' disabled>
            <label for="switch-p-3" class="cr"></label>
          </div>
        </div>
      </div>
      <ng-template #editarGuardar>
        <form [formGroup]="formUnidadMedida">
          <div class="row ">
            <div class="col-12 form-group">
              <label>Activo :</label>
              <div class="switch  d-inline m-r-10" style="margin-left: 10px;">
                <input type="checkbox" id="switch-p-1" formControlName="activo">
                <label for="switch-p-1" class="cr"></label>
              </div>
            </div>
            <mat-form-field appearance="outline" class="mff-reduc col-sm-12 col-12" *ngIf="(!editar && !ver)">
              <mat-label>Abreviatura</mat-label>
              <input matInput type="text" class="mayuscula" autocomplete="off" maxlength="10" formControlName="abrev" id="inpabr"
                [maxlength]="10" class="mayuscula">
            </mat-form-field>
            <ng-container *ngIf="(editar && !ver)">
              <label class="col-sm-3 col-form-label">Abreviatura :</label>
              <div class="col-sm-9">
                <label id="tx_area2" class="col-sm-12 col-form-label"><b>{{datos?.unidad}}</b></label>
              </div>
            </ng-container>
            <mat-form-field appearance="outline" class="mff-reduc col-sm-12 col-12">
              <mat-label>Unidad</mat-label>
              <input matInput type="text" class="mayuscula" autocomplete="off" maxlength="250" formControlName="unidad" id="descund"
                class="mayuscula" [maxLength]="250">
            </mat-form-field>
            <h4 class="col-12 sub-title h4-grupo"><b>Información Adicional</b></h4>
            <div class="col-12 form-group">
              <label>Porcentaje :</label>
              <div class="switch  d-inline m-r-10" style="margin-left: 10px;">
                <input type="checkbox" id="switch-p-2" formControlName="porcentaje" (change)="cambiarporc()">
                <label for="switch-p-2" class="cr"></label>
              </div>
            </div>
            <div class="col-12">
              <label>De Grupo :</label>
              <mat-form-field class="mff-reduc my-form-field w-100 col-12 col-sm-6" appearance="outline">
                <select matNativeControl formControlName="tipo_insumo" (change)="cambiargrupo()">
                  <option value="">--Seleccionar--</option>
                  <option *ngFor="let tipo of tipoInsumos" value="{{tipo.id_tipo_insumo}}">{{tipo.desc_tipo_insumo}}
                  </option>
                </select>
              </mat-form-field>
            </div>
            <div class="col-12">
              <label>Utilizar en :</label>
              <section class="example-section">
                <mat-checkbox class="example-margin" formControlName="util1">MANO DE OBRA</mat-checkbox>
                <mat-checkbox class="example-margin" formControlName="util2">MATERIALES</mat-checkbox>
                <mat-checkbox class="example-margin" formControlName="util3">EQUIPO</mat-checkbox>
                <mat-checkbox class="example-margin" formControlName="util4">SUBCONTRATOS</mat-checkbox>
              </section>
              <!-- <input type="checkbox" id="switch-p-1" formControlName="activo">MANO DE OBRA -->
              <!-- <mat-form-field class="mff-reduc my-form-field w-100 col-12 col-sm-6" appearance="outline">
                <select matNativeControl formControlName="tipo_insumo2">
                  <option value="">--Seleccionar--</option>
                  <option *ngFor="let tipo of tipoInsumos" value="{{tipo.id_tipo_insumo}}">{{tipo.desc_tipo_insumo}}
                  </option>
                </select>
              </mat-form-field> -->
              <!-- <ng-select matNativeControl formControlName="tipo_insumo2" [multiple]="true">
                <ng-option value="">--Seleccionar--</ng-option>
                <ng-option *ngFor="let tipo of tipoInsumos" value="{{tipo.id_tipo_insumo}}">{{tipo.desc_tipo_insumo}}
                </ng-option>
              </ng-select> -->
            </div>
            <div class="col-12 form-group">
              <label>Agregar Automaticamente :</label>
              <div class="switch  d-inline m-r-10" style="margin-left: 10px;">
                <input type="checkbox" id="switch-p-3" formControlName="automatico">
                <label for="switch-p-3" class="cr"></label>
              </div>
            </div>
          </div>
        </form>
      </ng-template>
    </div>

    <div class="app-modal-footer modal-footer justify-content-between">
      <button type="button" class="btn btn-danger btn-sm" (click)="closeModal('cancelar')"><i
          class="fa fa-times"></i>Cerrar</button>
      <button type="button" *ngIf="!ver" class="btn btn-success btn-sm" (click)="almacenar()"><i
          class="fa fa-check"></i>Guardar</button>
    </div>
  </div>
</div>

<app-cargando [bloquearTodo]="true" *ngIf="mostrar_carga_todo"></app-cargando>
