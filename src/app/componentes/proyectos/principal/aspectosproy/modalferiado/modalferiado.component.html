<div class="modal-dialog-scrollable modal-lg">
  <div class="modal-content">
      <div class="app-modal-header  modal-header">
          <h4 class="modal-title tit-modal1">
              <b *ngIf="!editar">Guardar No Laborables</b>
              <b *ngIf="editar">Editar No Laborables</b>
          </h4>
          <button type="button" class="close basic-close" (click)="closeModal('cerrar')">
              <span aria-hidden="true" class="mt-2">&times;</span>
          </button>
      </div>
      <div class="modal-body">
        <form [formGroup]="formDatos">
            <div class="row">
                <div class="col-12 col-sm-6 form-group">
                    <label>Laborado :</label>
                    <div class="switch  d-inline m-r-10" style="margin-left: 10px;">
                        <input type="checkbox" id="switch-p-1" formControlName="laborado">
                        <label for="switch-p-1" class="cr"></label>
                    </div>
                </div>
                <mat-form-field appearance="outline" class="mff-reduc col-sm-6 col-12">
                  <mat-label>Fecha</mat-label>
                  <input matInput type="date" formControlName="fecha">
                </mat-form-field>
                <mat-form-field appearance="outline" class="mff-reduc col-sm-12 col-12">
                    <mat-label>Descripción</mat-label>
                    <input matInput class="mayuscula" autocomplete="off" maxlength="250" formControlName="descripcion">
                </mat-form-field>
            </div>
        </form>
      </div>
      <div class="app-modal-footer modal-footer justify-content-between">
          <button type="button" class="btn btn-danger btn-sm" (click)="closeModal('cancelar')"><i
                  class="fa fa-times"></i>Cerrar</button>
          <button type="button" class="btn btn-success btn-sm" (click)="guardar()"><i
                  class="fa fa-check"></i>Guardar</button>
      </div>
  </div>
</div>


<app-cargando [bloquearTodo]="true" *ngIf="mostrar_carga_todo"></app-cargando>
