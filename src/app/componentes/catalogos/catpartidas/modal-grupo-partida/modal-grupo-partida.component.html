<div class="modal-md">
    <div class="modal-content">
        <div class="app-modal-header  modal-header">
            <h4 class="modal-title tit-modal1">
                <b>{{titmodal}}</b>
            </h4>
            <button type="button" class="close basic-close" (click)="closeModal('')">
                <span aria-hidden="true" class="mt-2">&times;</span>
            </button>
        </div>
        <div class="modal-body">
            <form [formGroup]="formAgrega">
                <div class="row">
                    <div *ngIf="!editar" class="col-12 col-sm-6 col-md-6 m-b-15">
                        <mat-form-field appearance="outline" class="mff-reduc w-100 alto-35">
                            <mat-label>Insertar</mat-label>
                            <select matNativeControl formControlName="formainsertar">
                                <option *ngIf="opcfila" value="3">BAJO LA SELECCION</option>
                                <option *ngIf="opcfila" value="2">SOBRE LA SELECCION</option>
                                <option *ngIf="estitulo" value="0">AL FINAL</option>
                                <option *ngIf="estitulo" value="1">AL INICIO</option>
                                <option *ngIf="!estitulo" value="0">AL FINAL DEL GRUPO</option>
                                <option *ngIf="!estitulo" value="1">AL INICIO DEL GRUPO</option>
                            </select>
                        </mat-form-field>
                    </div>
                    <!-- <div *ngIf="!subgrupo" class="col-12 col-sm-6 col-md-6 m-b-15">
                        <mat-form-field appearance="outline" class="mff-reduc w-100 alto-35">
                            <mat-label>Tipo de Proyecto</mat-label>
                            <select matNativeControl formControlName="tipoproyecto">
                                <option value="">--Seleccionar--</option>
                                <option *ngFor="let tipo of tipoProy" [value]="tipo.id_clasificacion">
                                    {{tipo.descripcion}}
                                </option>
                            </select>
                        </mat-form-field>
                    </div> -->
                    <mat-form-field appearance="outline" class="mff-reduc col-sm-12 col-12">
                        <mat-label>Titulo</mat-label>
                        <input matInput id="descrip" class="mayuscula" autocomplete="off" maxlength="250" formControlName="titulo" (keyup)="keyaction($event)">
                    </mat-form-field>
                </div>
            </form>
            <div *ngIf="!editar" class="m-b-10">
                Registro Preliminar de titulos
                <button type="button" class="btn btn-info btn-sm" (click)="addtoTabla('')"><i
                    class="icofont icofont-arrow-down"></i>Agregar
                </button>
            </div>
            <div *ngIf="!editar">
                <ul class="list-group list-group-flush d-flex">
                    <li class="list-group-item " *ngFor="let item of arregloseleccion; let i = index">
                        <label class="custom-label-list m-b-0" style="width: calc(100% - 25px);">{{i+1}}  {{item.descripcion}}</label>
                        <!-- <label class="custom-texto-list m-b-0" style="width: calc(50% - 25px);">{{item.desctipoproy}}</label> -->
                        <button class="btn btn-danger btn-mini2" ngbTooltip="Eliminar" container="body" (click)="eliminarfila(i)">
                            <i class="fa fa-remove icono-but"></i>
                        </button>
                    </li>
                    <li *ngIf="arregloseleccion.length==0" class="list-group-item">
                        <label class="custom-label-list">No se agrego ningun Titulo</label>
                        <!-- <span class="custom-texto-list ml-1 float-xl-right">{{item.desctipoproy}}</span> -->
                    </li>
                </ul>
            </div>
        </div>
        <div class="app-modal-footer modal-footer justify-content-between">
            <button type="button" class="btn btn-danger btn-sm" (click)="closeModal('')"><i
                    class="fa fa-times"></i>Cerrar</button>
            <button type="button" class="btn btn-success btn-sm" (click)="botonGuarda()"><i
                    class="fa fa-check"></i>{{editar?'Actualizar':'Registrar'}}</button>
        </div>
    </div>
</div>
<app-cargando [bloquearTodo]="true" *ngIf="mostrar_carga_todo"></app-cargando>
