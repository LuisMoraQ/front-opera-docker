<div class="page-body">
  <div class="row">
      <div [ngClass]="{'col-lg-6 col-md-6 col-sm-12 col-12': (!expandirClasificacion && !expandirTipo), 
                  'col-md-12 col-sm-12': (expandirTipo && !expandirClasificacion),
                  'd-none': (expandirClasificacion && !expandirTipo)}">
          <app-unidadesuser (cargaCompleta2)="this.cargando2 = $event" (expanded)="expandir($event, null)"></app-unidadesuser>
      </div>
      <div 
      [ngClass]="{'col-lg-6 col-md-6 col-sm-12 col-12': (!expandirClasificacion && !expandirTipo), 
      'col-md-12 col-sm-12': (!expandirTipo && expandirClasificacion),
      'd-none': (!expandirClasificacion && expandirTipo)}">
          <app-clasificacion-comercial (cargaCompleta)="this.cargando = $event" [fuentepasa]="1" (expanded)="expandir( null, $event)"></app-clasificacion-comercial>
      </div>
  </div>
</div>
