<div class="page-body">
    <div class="titulo-contenido">
        <h2>Clasificación Comercial</h2>
    </div>
    <app-card class="card col-md-12 card-principal">
        <div class="row justify-content-between p-r-15">
            <!-- <div class="col-sm-5 col-md-5" style="margin-bottom: 10px;">
                <input type="search" id="txt_busca" (keyup)="applyFilterPrinc($event)" class="form-control form-control-primary" autocomplete="off" placeholder="Buscar" #input (search)="limpiarfiltro()">
            </div> -->

            <div class="col-sm-5 col-md-5" style="margin-bottom: 10px;">
                <mat-form-field class="mff-reduc w-100 alto-35 field-busqueda" appearance="outline">
                    <mat-label>Buscar</mat-label>
                    <input matInput type="text" [(ngModel)]="busqueda" autocomplete="off"><!-- (keyup)="applyFilterPrinc($event)" -->
                    <button *ngIf="busqueda" matSuffix mat-icon-button aria-label="Clear" (click)="limpiarfiltro()">
                        <mat-icon>close</mat-icon>
                    </button>
                </mat-form-field>
            </div>

            <div class="col-xl-4 col-sm-12 col-md-6">
                <mat-form-field appearance="outline" class="mff-reduc col-12 alto-35 px-0">
                    <mat-label>Tipo Insumo</mat-label>
                    <select matNativeControl (change)="cambiarTipoIns($event.target.value)">
                        <option value="">--Todos--</option>
                        <option *ngFor="let tipoins of tipoInsumos"
                            [value]="tipoins.id_tipo_insumo">
                            {{tipoins.desc_tipo_insumo}}
                        </option>
                    </select>
                </mat-form-field>
            </div>

            <div class="content">
                <button type="button" class="btn btn-success btn-sm light ripple m-b-10 m-r-5" (click)="openModal()"
                    (mouseup)="quitarfoco($event);">
                    <i class="fa fa-plus"></i>Agregar
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm light ripple  m-b-10 float-right"
                    (mouseup)="quitarfoco($event);" [ngbTooltip]="maximizar ? 'Reducir' : 'Expandir'"
                    (click)="expandir()" container="body">
                    <i class="fa  mr-0"
                        [ngClass]="{'fa-long-arrow-right': maximizar,'fa-long-arrow-left': !maximizar}"></i>
                </button>
            </div>
        </div>
        <div [style.height.px]="height" class="tabla-limp">
            <table class="table-bordered">
                <thead>
                    <tr class="headsticky header-custom">
                        <th appAnchocol [ancho]="55">N°</th>
                        <th appAnchocol [ancho]="200" [detalle]="true">Descripción</th>
                        <th appAnchocol [ancho]="90">Abrev</th>
                        <th appAnchocol [ancho]="120">Tipo Insumo</th>
                        <th appAnchocol [ancho]="30">Act</th>
                        <th appAnchocol [ancho]="90">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <ng-container *ngIf="dataSource.length>0">
                        <tr *ngFor="let row of dataSource | filtoTablaDesc: busqueda: 'desc_clasi'; let i = index"
                            [ngClass]="{'highlight': fila_sel == i}" (click)="cambindicesel(i)">
                            <td appAnchocol [ancho]="55">
                                {{i+1}}
                            </td>
                            <td class="text-left" appAnchocol [ancho]="200" [detalle]="true">
                                <div class="recortatext" placement="top" ngbTooltip="{{row.desc_clasi}}" container="body">
                                    {{row.desc_clasi}}
                                </div>
                            </td>
                            <td appAnchocol [ancho]="90">
                                {{row.abrev}}
                            </td>
                            <td appAnchocol [ancho]="120">
                                {{row.desc_tipo_insumo}}
                            </td>
                            <td appAnchocol [ancho]="30">
                                <span *ngIf="row.activo=='1'" class="numberCircle backg-success"></span>
                                <span *ngIf="row.activo=='0'" class="numberCircle backg-danger"></span>
                            </td>
                            <td appAnchocol [ancho]="90">
                                <div class="d-flex">
                                    <button class="btn btn-mini btn-info" placement="top" ngbTooltip="Ver" container="body"
                                        (click)="openModal(row, false, true)" (mouseup)="quitarfoco($event);">
                                        <i class="fa fa-search icono-but"></i>
                                    </button>
                                    <div *ngIf="fuentepasa==1 && row.fuente==0" class="m-l-2">
                                        <i class="fa fa-lock fa-2x icono-but  text-danger"
                                            style="margin-top: 1px;"></i>
                                    </div>
                                    <button class="btn btn-mini btn-primary" placement="top" ngbTooltip="Editar" container="body"
                                        *ngIf="fuentepasa==0 || (fuentepasa==1 && row.fuente!=0)" (click)="openModal(row, true)" (mouseup)="quitarfoco($event);">
                                        <i class="fa fa-pencil icono-but"></i>
                                    </button>
                                    <button class="btn btn-mini btn-danger" placement="top" ngbTooltip="Eliminar" container="body"
                                        *ngIf="fuentepasa==0 || (fuentepasa==1 && row.fuente!=0)" (click)="eliminarClasificacionComercial(row)" (mouseup)="quitarfoco($event);">
                                        <i class="fa fa-remove icono-but"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </ng-container>
                    <ng-container *ngIf="dataSource.length<=0">
                        <tr>
                            <td class="mat-cell text-center" colspan="8">
                                <label *ngIf="!buscando">No se encontraron resultados</label>
                                <div *ngIf="buscando" class="preloader3 loader-block">
                                    <div class="circ1"></div>
                                    <div class="circ2"></div>
                                    <div class="circ3"></div>
                                    <div class="circ4"></div>
                                </div>
                            </td>
                        </tr>
                    </ng-container>
                </tbody>
            </table>
        </div>

    </app-card>
    <app-cargando [bloquearTodo]="true" *ngIf="mostrar_carga_todo"></app-cargando>
    <app-cargando [bloquearTodo]="false" *ngIf="mostrar_carga"></app-cargando>
</div>
