            </div>
            <div
              [style.width.px]="width"
              class="overflow-auto"
              [ngStyle]="{
                height: 'calc(100vh - ' + (hBotones2 + 180) + 'px)'
              }"
            >
              <table class="table-bordered tab-10 table-m">
                <thead class="text-center">
                  <tr class="headsticky">
                    <th appAnchocol [ancho]="45" class="th-custom">Nº</th>
                    <th
                      appAnchocol
                      [ancho]="300"
                      [detalle]="true"
                      class="th-custom"
                    >
                      <div class="d-flex justify-content-center">
                        <a
                          style="padding: 0px 2px; cursor: pointer"
                          ngbTooltip="Expandir Todo"
                          container="body"
                          (click)="maxtodo()"
                          ><i class="icofont icofont-caret-down"></i
                        ></a>
                        <a
                          style="padding: 0px 2px; cursor: pointer"
                          ngbTooltip="Contraer Todo"
                          container="body"
                          (click)="mintodo()"
                          ><i class="icofont icofont-caret-up"></i
                        ></a>
                        <span style="width: calc(100% - 35px)"
                          >Descripción</span
                        >
                      </div>
                    </th>
                    <th appAnchocol [ancho]="55" class="th-custom">Unidad</th>
                    <th appAnchocol [ancho]="100" class="th-custom">
                      <div class="d-flex justify-content-center">
                        <span>Metrado</span>
                        <div
                          class="text-center"
                          container="body"
                          ngbTooltip="La edicion de la celda directa altera a metrado  sin alterar totales resultantes de tablas detalle"
                        >
                          <i class="fa fa-info ml-1"></i>
                        </div>
                      </div>
                    </th>
                    <th appAnchocol [ancho]="80" class="th-custom">Precio</th>
                    <th appAnchocol [ancho]="100" class="th-custom">
                      Parciales Metrado
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <ng-container *ngIf="dataSource.length; else noData">
                    <tr
                      *ngFor="let partida of dataSource; let i = index"
                      (click)="seleccionRowTabla1(partida, i)"
                    >
                      <ng-container *ngIf="partida.mostrar">
                        <td
                          appAnchocol
                          [ancho]="45"
                          [ngClass]="{
                            highlight: filaSel == i,
                            'bg-editado': partida.editadoMetrado
                          }"
                          class="text-center td-custom"
                        >
                          {{ i + 1 }}
                        </td>
                        <td
                          appAnchocol
                          [ancho]="300"
                          [detalle]="true"
                          [ngClass]="{ highlight: filaSel == i }"
                          appPintarfilapre
                          [tipo]="titulo1"
                          [color]="titulo1color"
                          [letra]="titulo1letra"
                          [item]="partida.item"
                          [separador]="'.'"
                          [partida]="partida.unidad != '' ? true : false"
                          class="td-custom"
                        >
                          <div
                            class="recortatextlinea text-left"
                            [style.padding-left.px]="
                              (partida.item.toString().split('.').length - 1) *
                                5 +
                              (partida.unidad ? 17 : 0)
                            "
                            ngbTooltip="{{ partida.descripcion }}"
                            #t="ngbTooltip"
                            container="body"
                            triggers="click:blur"
                            (mouseout)="t.close()"
                          >
                            <a
                              *ngIf="!partida.unidad && partida.icomost == '0'"
                              style="
                                padding: 0px 2px;
                                color: #06bb06;
                                cursor: pointer;
                              "
                              (click)="toggleOnpresu(partida.item, i)"
                            >
                              <i class="icofont icofont-caret-down"></i>
                            </a>
                            <a
                              *ngIf="!partida.unidad && partida.icomost == '1'"
                              (click)="toggleOffpresu(partida.item, i)"
                              style="
                                padding: 0px 2px;
                                color: red;
                                cursor: pointer;
                              "
                            >
                              <i class="icofont icofont-caret-up"></i>
                            </a>
                            <span style="font-weight: 700">{{
                              partida.item
                            }}</span
                            >&nbsp;&nbsp;<span>{{ partida.descripcion }}</span>
                          </div>
                        </td>
                        <td
                          appAnchocol
                          [ngClass]="{ highlight: filaSel == i }"
                          [ancho]="55"
                          appPintarfilapre
                          [tipo]="titulo1"
                          [color]="titulo1color"
                          [letra]="titulo1letra"
                          [item]="partida.item"
                          [separador]="'.'"
                          [partida]="partida.unidad != '' ? true : false"
                          class="text-center td-custom"
                        >
                          {{ partida.unidad }}
                        </td>
                        <td
                          appAnchocol
                          [ngClass]="{ highlight: filaSel == i }"
                          [ancho]="100"
                          appPintarfilapre
                          [tipo]="titulo1"
                          [color]="titulo1color"
                          [letra]="titulo1letra"
                          [item]="partida.item"
                          [separador]="'.'"
                          [partida]="partida.unidad != '' ? true : false"
                          (click)="edicionCeldaMetrado(partida, i)"
                          class="text-right td-custom"
                        >
                          <div
                            class="d-flex justify-content-between"
                            *ngIf="!partida.editarMetrado && partida.unidad"
                          >
                            <i
                              class="fa"
                              container="body"
                              [ngClass]="tipoClass(partida)"
                              [ngbTooltip]="tooltipTipo(partida)"
                            >
                            </i>

                            <div>
                              {{ partida.cant_metrado | number : "0." + this.dec_metrado}}
                            </div>
                          </div>

                          <ng-container *ngIf="partida.editarMetrado">
                            <input
                            #inputMetradoMonto
                              type="text"
                              [value]="partida.cant_metrado"
                              [textMask]="
                                this.dec_metrado == 4
                                  ? this.formsService.maskUsAmountDecimal4Neg
                                  : this.dec_metrado == 3
                                  ? this.formsService.maskUsAmountDecimal3Neg
                                  : this.formsService.maskUsAmountDecimal2Neg
                              "
                              appAutoFocus
                              (select)="inputMetradoMonto.select()"
                              class="w-100 mayuscula text-right"
                              (keydown.enter)="
                                evaluarTextoMetrado($event.target.value, i)
                              "
                              (blur)="
                                evaluarTextoMetrado($event.target.value, i)
                              "
                              autocomplete="off"
                            />
                          </ng-container>
                        </td>
                        <td
                          appAnchocol
                          [ngClass]="{ highlight: filaSel == i }"
                          [ancho]="80"
                          appPintarfilapre
                          [tipo]="titulo1"
                          [color]="titulo1color"
                          [letra]="titulo1letra"
                          [item]="partida.item"
                          [separador]="'.'"
                          [partida]="partida.unidad != '' ? true : false"
                          class="text-right td-custom"
                        >
                          {{ partida.precio | number : "0." + this.dec_precio }}
                        </td>
                        <td
                          appAnchocol
                          [ngClass]="{ highlight: filaSel == i }"
                          [ancho]="100"
                          appPintarfilapre
                          [tipo]="titulo1"
                          [color]="titulo1color"
                          [letra]="titulo1letra"
                          [item]="partida.item"
                          [separador]="'.'"
                          [partida]="partida.unidad != '' ? true : false"
                          class="text-right td-custom"
                        >
                          {{ partida.parcial | number : "0." + this.dec_parcial }}
                        </td>
                      </ng-container>
                    </tr>
                  </ng-container>
                  <ng-template #noData>
                    <tr>
                      <td class="mat-cell text-center td-custom" colspan="11">
                        <label *ngIf="!buscando"
                          >No se encontraron resultados</label
                        >
                        <div *ngIf="buscando" class="preloader3 loader-block">
                          <div class="circ1"></div>
                          <div class="circ2"></div>
                          <div class="circ3"></div>
                          <div class="circ4"></div>
                        </div>
                      </td>
                    </tr>
                  </ng-template>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="resize-action" (mousedown)="setStatus($event, 1)"></div>
        <div
          class="col pr-0"
          [ngStyle]="{ width: 'calc(100vw - ' + (width + 130) + 'px)' }"
          id="tablasContainer"
        >
          <div class="col-12 px-0">
            <div #box2 class="col-12 px-0 justify-content-between">

                *ngIf="
                  partidaSeleccionada?.unidad && !tablaSeleccionada && !solover && editable

                <div class="btn-group" style="margin-bottom: 3px">

                      habilitarMultipleSelect ||

                      habilitadoCopiar ||
                      seleccionCelda ||

                    container="body"
                    [ngbPopover]="popOptions"

                      habilitarMultipleSelect ||
                      bloquearBotones ||
                      habilitadoCopiar ||

                    <i class="fa fa-caret-down icono-but"></i>

                    class="btn btn-mini btn-group-mini btn-outline-primary"

                    (mouseup)="quitarfoco($event)"

                    <i class="fa fa-scribd icono-but"></i>

                    ngbTooltip="Agregar Submetrado Multiple"

                    (mouseup)="quitarfoco($event)"
                    [disabled]="
                      metradoSeleccionado?.id_metrado == null ||
                      metradoSeleccionado?.estitulo == 1 ||
                      habilitarMultipleSelect ||
                      bloquearBotones ||
                      habilitadoCopiar ||
                      seleccionCelda ||
                      copiadoCeldas
                    "
                    [placement]="['right', 'auto']"

                    #p2="ngbPopover"

                  >
                    <i class="fa fa-caret-down icono-but"></i>
                  </button>

                      bloquearBotones ||
                      habilitadoCopiar ||
                      seleccionCelda ||
                      copiadoCeldas
                    "
                  >
                    <i class="icofont icofont-brand-tango icono-but"></i>
                  </button>
                  <button

                    class="btn btn-mini btn-group-mini btn-outline-primary"

                    container="body"
                    (mouseup)="quitarfoco($event)"
                    [disabled]="
                      !metradoSeleccionado ||
                      metradoSeleccionado?.id_metrado == null ||
                      habilitarMultipleSelect ||
                      bloquearBotones ||
                      habilitadoCopiar ||
                      seleccionCelda ||
                      copiadoCeldas
                    "
                  >
                    <i class="icofont-strike-through icono-but pos-r-3"></i>
                  </button>
                  <button
                    class="btn btn-mini btn-group-mini btn-outline-primary"
                    placement="bottom"
                    (click)="agregarFila(false)"
                    ngbTooltip="Agregar fila vacia"
                    type="button"
                    container="body"
                    [disabled]="
                      !tablaSistema.length ||
                      habilitarMultipleSelect ||
                      bloquearBotones ||
                      habilitadoCopiar ||
                      seleccionCelda ||
                      copiadoCeldas
                    "
                    (mouseup)="quitarfoco($event)"
                  >
                    <i class="fa fa-plus icono-but"></i>
                  </button>

                  <button
                    class="btn btn-mini btn-group-mini btn-outline-primary btn-gru-multiple"
                    [ngbPopover]="popOptions3"
                    type="button"
                    [disabled]="
                      !tablaSistema.length ||
                      habilitarMultipleSelect ||
                      bloquearBotones ||
                      habilitadoCopiar ||
                      seleccionCelda ||
                      copiadoCeldas
                    "
                    [placement]="['bottom', 'auto']"
                    ngbTooltip="Agregar Multiple filas vacias"
                    #p3="ngbPopover"
                    [autoClose]="'outside'"
                    container="body"
                    (click)="cantFil = 1"
                    (mouseup)="quitarfoco($event)"
                  >
                    <i class="fa fa-caret-down icono-but"></i>
                  </button>
                </div>
                &nbsp;&nbsp;&nbsp;

                    class="btn btn-mini btn-group-mini btn-outline-primary"
                    (click)="moverArriba()"
                    container="body"
                    type="button"
                    ngbTooltip="Mover Arriba (CTRL +  &#x2B06;)"
                    (mouseup)="quitarfoco($event)"

                      metradoSeleccionado?.id_metrado == null ||
                      metradoSeleccionado?.estitulo == 2 ||
                      habilitarMultipleSelect ||
                      bloquearBotones ||
                      habilitadoCopiar ||
                      seleccionCelda ||
                      copiadoCeldas
                    "
                  >
                    <i class="icofont icofont-arrow-up icono-but"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-mini btn-group-mini btn-outline-primary"
                    (click)="moverAbajo()"
                    ngbTooltip="Mover Abajo (CTRL + &#x2B07;)"
                    type="button"
                    container="body"
                    (mouseup)="quitarfoco($event)"
                    [disabled]="
                      metradoSeleccionado?.id_metrado == null ||
                      metradoSeleccionado?.estitulo == 2 ||
                      habilitarMultipleSelect ||
                      bloquearBotones ||
                      habilitadoCopiar ||
                      seleccionCelda ||
                      copiadoCeldas
                    "
                  >
                    <i class="icofont icofont-arrow-down icono-but"></i>
                  </button>

                      (metradoSeleccionado?.id_metrado == null &&
                        !habilitadoCopiar) ||
                      metradoSeleccionado?.estitulo == 1 ||
                      habilitarMultipleSelect ||
                      bloquearBotones ||
                      seleccionCelda ||
                      copiadoCeldas
                    "
                  >
                    <i class="icofont icofont-arrow-left icono-but"></i>

          >
            <input
              type="file"
              id="archivo"
              name="fileUpload2"
              accept=".xls ,.xlsx"
              (change)="importarExcel($event)"

          <button *ngIf="editable"
            class="btn btn-mini btn-group-mini btn-danger"
            container="body"
            style="margin-left: 1px"

          >
            <i class="fa fa-trash icono-but" aria-hidden="true"></i>
          </button>
          <button *ngIf="editable"
            class="btn btn-mini btn-group-mini btn-success"
            container="body"
            style="margin-left: 1px"
            [disabled]="noConsistente || noConsistente2"
            ngbTooltip="Guardar cambios tabla importada hoja de calculo del titulo"
            type="button"
            (mouseup)="quitarfoco($event)"
            (click)="guardarCambiosTablaExcelImportado()"
          >
            <i class="fa fa-save icono-but" aria-hidden="true"></i>
          </button>

          <button *ngIf="editable"
            class="btn btn-mini btn-group-mini btn-outline-primary ml-3"
            container="body"
            style="margin-left: 1px"
            [ngbTooltip]="
              excelMultiple
                ? 'Cancelar seleccion multiple'
                : 'Habilitar selecciona multiple'
            "
            type="button"
            (mouseup)="quitarfoco($event)"
            [disabled]="noConsistente || noConsistente2"
            (click)="multipleSeleccion()"
          >
            <i
              class="fa icono-but"
              [ngClass]="{
                'fa-check-square-o': !excelMultiple,
                'fa-ban': excelMultiple
              }"
              aria-hidden="true"
            ></i>
          </button>
          <button *ngIf="editable"
            class="btn btn-mini btn-group-mini btn-outline-primary"
            container="body"
            style="margin-left: 1px; width: 30px; font-size: 22px !important"
            ngbTooltip="Convertir a Titulo"
            type="button"
            (mouseup)="quitarfoco($event)"
            [disabled]="
              noConsistente || noConsistente2 ||
              filaExcelSel?.item ||
              (!excelMultiple && filaExcelSel && filaExcelSel?.item)
            "
            (click)="nivelSeleccionado(1)"
          >
            T
          </button>
          <button *ngIf="editable"
            class="btn btn-mini btn-group-mini btn-outline-primary"
            container="body"
            style="margin-left: 1px; width: 30px; font-size: 22px !important"
            ngbTooltip="Convertir a Metrado"
            type="button"
            (mouseup)="quitarfoco($event)"
            [disabled]="
              noConsistente|| noConsistente2 || 
              filaExcelSel?.item ||
              (!excelMultiple && filaExcelSel && filaExcelSel?.item)
            "
            (click)="nivelSeleccionado(2)"
          >
            M
          </button>
          <button *ngIf="editable"
            class="btn btn-mini btn-group-mini btn-outline-primary"
            container="body"
            style="margin-left: 1px; width: 30px; font-size: 22px !important"
            ngbTooltip="Convertir a Submetrado"
            type="button"
            (mouseup)="quitarfoco($event)"
            [disabled]="
              noConsistente || noConsistente2 ||
              filaExcelSel?.item ||
              (!excelMultiple && filaExcelSel && filaExcelSel?.item)
            "
            (click)="nivelSeleccionado(3)"
          >
            S
          </button>
          <button *ngIf="editable"
            class="btn btn-mini btn-group-mini btn-outline-primary"
            container="body"
            style="margin-left: 1px; width: 30px; font-size: 17px !important"
            ngbTooltip="Convertir a Texto"
            type="button"
            (mouseup)="quitarfoco($event)"
            [disabled]="
              noConsistente || noConsistente2 ||
              filaExcelSel?.item ||
              (!excelMultiple && filaExcelSel && filaExcelSel?.item)
            "
            (click)="nivelSeleccionado(4)"
          >
            <i class="icofont-strike-through icono-but"></i>
          </button>
          <button *ngIf="editable"
            type="button"
            class="btn btn-mini btn-group-mini btn-outline-primary"
            placement="top"
            [disabled]="noConsistente || noConsistente2"
            ngbTooltip="Estilos Tablas Hoja del proyecto"
            container="body"
            (click)="modalEstilosDetalle()"
            (mouseup)="quitarfoco($event)"
          >
            <i class="icofont icofont-color-bucket icono-but"></i>
          </button>
          <button
            type="button"
            class="btn btn-mini btn-group-mini btn-outline-primary"
            [ngClass]="{'ml-3': editable }"
            placement="bottom"
            ngbTooltip="Impresion título"
            container="body"
            (click)="impresionMetrado(3)"
            (mouseup)="quitarfoco($event)"
          >
            <i class="icofont icofont-print icono-but"></i>
          </button>

          <button
            type="button"
            class="btn btn-mini btn-group-mini btn-outline-primary"
            placement="top"
            ngbTooltip="Exportar Excel"
            container="body"
            (click)="exportarExcel()"
            (mouseup)="quitarfoco($event)"
          >
            <i class="icofont icofont-file-excel icono-but"></i>
          </button>
        </div>
        <div
          style="display: grid; align-content: end"
          *ngIf="tablaExcelAdjunta.length"
        >
          <div class="d-flex">
            <div style="align-content: center; display: inline-grid">
              <span
                class="badge ml-2"
                *ngIf="tablaExcelAdjunta.length"
                [ngClass]="{
                  'bg-danger':
                    (!vinculadoExcel && !noConsistente) ||
                    noConsistente ||
                    noConsistente2,
                  'bg-success':
                    vinculadoExcel && !noConsistente && !noConsistente2
                }"
                container="body"
              >
                <ng-container *ngIf="!noConsistente && !noConsistente2">
                  <ng-container *ngIf="!vinculadoExcel">
                    Filas no Vinculadas
                  </ng-container>
                  <ng-container *ngIf="vinculadoExcel">
                    Vinculado
                  </ng-container>
                </ng-container>
                <ng-container *ngIf="noConsistente && !noConsistente2">
                  Excel con elementos diferentes
                </ng-container>
                <ng-container *ngIf="noConsistente2">
                  Presupuesto diferente al excel existente
                  <i
                    class="fa fa-list" style="cursor: pointer;"
                    [ngbTooltip]="
                      tipContent
                    "
                    container="body"
                  ></i>
                </ng-container>
                <ng-template #tipContent>
                  Filas no Existentes ({{faltantesPresupuesto.length}}): <br> 
                  <ng-container *ngFor="let row of faltantesPresupuesto; let i = index">
                    <b>{{row}}</b> <ng-container *ngIf="i + 1 < faltantes.length"><br></ng-container>
                  </ng-container>
                  </ng-template
                >
              </span>
            </div>

            <div class="leyenda-noExiste bg-cantidad-diferente ml-2"></div>
            <div class="leyendas-text recortatext1l">No Vinculado</div>
            <div class="leyenda-noExiste bg-noExistePresu"></div>
            <div class="leyendas-text recortatext1l">
              No Existe en Presupuesto
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 px-0 height-tabla-excel overflow-auto">
      <ng-container *ngIf="!tablaExcelAdjunta.length">
        <div class="alert alert-warning-custom text-center" role="alert">
          Información no asignada al titulo seleccionado.
        </div>
      </ng-container>
      <ng-container *ngIf="tablaExcelAdjunta.length">
        <table class="tabla-general tabla-10 table-bordered table-m">
          <thead class="text-center">
            <tr class="tr1-sticky">
              <th
                class="th-custom"
                [colSpan]="this.headerExcel?.grupos_header?.i + 2"
              ></th>
              <th
                class="th-custom"
                *ngIf="this.headerExcel?.grupos_header?.g"
                [colSpan]="this.headerExcel?.grupos_header?.g"
              >
                Generales
              </th>
              <th
                class="th-custom"
                *ngIf="this.headerExcel?.grupos_header?.d"
                [colSpan]="this.headerExcel?.grupos_header?.d"
              >
                Descuentos
              </th>
              <th
                class="th-custom"
                [colSpan]="this.headerExcel?.grupos_header?.f + 1"
              ></th>
            </tr>
            <tr class="tr2-sticky">
              <th style="width: 30px" class="th-custom"></th>
              <th style="width: 35px" class="th-custom">
                <div class="d-flex justify-content-center text-center w-100">
                  <a
                    style="padding: 0px 2px; cursor: pointer"
                    ngbTooltip="Expandir todos los detalles"
                    container="body"
                    (click)="maxtodoExcel()"
                    ><i class="icofont icofont-caret-down"></i
                  ></a>
                  <a
                    style="padding: 0px 2px; cursor: pointer"
                    ngbTooltip="Contraer todos los detalles"
                    container="body"
                    (click)="mintodoExcel()"
                    ><i class="icofont icofont-caret-up"></i
                  ></a>
                </div>
              </th>

              <th
                class="text-center text-capitalize th-custom"
                *ngFor="let head of this.headerExcel?.header2"
                [ngClass]="{ 'width-descripcion': head == 'descripcion' }"
              >
                {{ head }}
              </th>
              <th class="th-custom">Hoja de Calculo</th>
            </tr>
          </thead>
          <tbody>
            <tr
              *ngFor="let row of this.tablaExcelAdjunta; let i = index"
              (click)="seleccionTablaExcel(row, i)"
            >
              <ng-container *ngIf="row.mostrar == 1">
                <td
                  class="text-center td-custom"
                  *ngIf="excelMultiple; else indicesList"
                  [ngClass]="{
                    'row-seleccionado': filaExcelSel == row,
                    nivel1: row.nivel == 1,
                    nivel2: row.nivel == 2,
                    nivel3: row.nivel == 3
                  }"
                >
                  <button
                    class="btn btn-mini2 btn-group-mini btn-secondary"
                    container="body"
                    *ngIf="row.item && row.unidad && row.tipo !== 0"
                    ngbTooltip="Seleccionar todo realacionado a la partida"
                    type="button"
                    (mouseup)="quitarfoco($event)"
                    (click)="seleccionarTodoPartida(i)"
                  >
                    <i class="fa fa-save icono-but" aria-hidden="true"></i>
                  </button>
                  <mat-checkbox
                    *ngIf="(row.tipo == null || row.tipo == 0) && !row.item"
                    [checked]="row.seleccionado"
                    (change)="cambioCheckExcel(i, $event)"
                  ></mat-checkbox>
                </td>
                <ng-template #indicesList>
                  <td class="text-center td-custom">
                    {{ i + 1 }}
                  </td>
                </ng-template>

                <td class="text-center td-custom">
                  <a
                    *ngIf="!row.nivel && row.icomost == 0 && row.item"
                    style="padding: 0px 2px; color: #06bb06; cursor: pointer"
                    (click)="toggleOnExcel(row.item, i)"
                  >
                    <i class="icofont icofont-caret-down"></i>
                  </a>
                  <a
                    *ngIf="!row.nivel && row.icomost == 1 && row.item"
                    (click)="toggleOffExcel(row.item, i)"
                    style="padding: 0px 2px; color: red; cursor: pointer"
                  >
                    <i class="icofont icofont-caret-up"></i>
                  </a>

                  <ng-container
                    *ngIf="!row.item && (row.nivel == 1 || row.nivel == 2)"
                  >
                    <a
                      *ngIf="row.icomost == 0"
                      style="
                        padding: 0px 2px;
                        color: #06bb06;
                        font-size: 10px;
                        cursor: pointer;
                      "
                      (click)="toggleOnPartida(i, row.nivel)"
                    >
                      <i class="icofont icofont-plus"></i>
                    </a>
                    <a
                      *ngIf="row.icomost == 1"
                      (click)="toggleOffPartida(i, row.nivel)"
                      style="
                        padding: 0px 2px;
                        color: red;
                        cursor: pointer;
                        font-size: 10px;
                      "
                    >
                      <i class="icofont icofont icofont-minus"></i>
                    </a>
                  </ng-container>
                </td>

                <td
                  *ngFor="let head of this.headerExcel?.header"
                  appPintarfilapre
                  [tipo]="titulo1"
                  [color]="row.item ? titulo1color : ''"
                  [letra]="titulo1letra"
                  [item]="row.item"
                  [separador]="'.'"
                  [partida]="row.unidad != ''"
                  class="td-custom"
                  [style.text-align]="
                    head == 'descripcion' && !row.item
                      ? alineamientoTexto2(row)
                      : ''
                  "
                  [ngClass]="{
                    'row-seleccionado': filaExcelSel == row,
                    'text-right':
                      row.mtotal &&
                      row.item &&
                      (row.tipo == 1 ||
                        (row.tipo == null && row.nivel == null)) &&
                      head == 'mtotal',
                    'font-weight-bolder': head == 'mtotal',
                    'bg-noExistePresu': row.pintar == 1,
                    'bg-cantidad-diferente': row.pintar == 2
                  }"
                  [style.color]="
                    !row.item ? colorTexto2(row) : '' + ' !important'
                  "
                >
                  <div
                    class="recortatextlinea"
                    [ngClass]="{
                      'ml-1':
                        head == 'descripcion' &&
                        !row.item &&
                        (row.nivel == 1 || row.nivel == 2),
                      'ml-3':
                        (head == 'descripcion' &&
                          !row.item &&
                          row.nivel == null && !row.tipo) ||
                        (head == 'descripcion' && row.nivel == 3) ||
                        (head == 'descripcion' && !row.item && row.nivel == 4)
                    }"
                    [style.font-size.px]="
                      !row.item
                        ? !row.tipo && row.nivel == 1
                          ? stilosTit.size
                          : !row.tipo && row.nivel == 4
                          ? stilosTexto.size
                          : (!row.tipo && row.nivel == 3) || row.nivel == null
                          ? stilosSubM.size
                          : stilosMet.size
                        : ''
                    "
                    [class.normal]="
                      !row.item &&
                      ((stilosTit.tipo == '1' && !row.tipo && row.nivel == 1) ||
                        (stilosTexto.tipo == '1' &&
                          !row.tipo &&
                          row.nivel == 4) ||
                        (stilosSubM.tipo == '1' &&
                          ((!row.tipo && row.nivel == 3) ||
                            row.nivel == null)) ||
                        (stilosMet.tipo == '1' && !row.tipo && row.nivel == 2))
                    "
                    [class.cursiva]="
                      !row.item &&
                      ((stilosTit.tipo == '2' && !row.tipo && row.nivel == 1) ||
                        (stilosTexto.tipo == '2' &&
                          !row.tipo &&
                          row.nivel == 4) ||
                        (stilosSubM.tipo == '2' &&
                          ((!row.tipo && row.nivel == 3) ||
                            row.nivel == null)) ||
                        (stilosMet.tipo == '2' && !row.tipo && row.nivel == 2))
                    "
                    [class.negrita]="
                      !row.item &&
                      ((stilosTit.tipo == '3' && !row.tipo && row.nivel == 1) ||
                        (stilosTexto.tipo == '3' &&
                          !row.tipo &&
                          row.nivel == 4) ||
                        (stilosSubM.tipo == '3' &&
                          ((!row.tipo && row.nivel == 3) ||
                            row.nivel == null)) ||
                        (stilosMet.tipo == '3' &&
                          !row.tipo && row.nivel == 2) ||
                        (row.item && row.tipo == 1))
                    "
                    [class.cursivanegrita]="
                      !row.item &&
                      ((stilosTit.tipo == '4' && !row.tipo && row.nivel == 1) ||
                        (stilosTexto.tipo == '4' &&
                          !row.tipo &&
                          row.nivel == 4) ||
                        (stilosSubM.tipo == '4' &&
                          ((!row.tipo && row.nivel == 3) ||
                            row.nivel == null)) ||
                        (stilosMet.tipo == '4' && !row.tipo && row.nivel == 2))
                    "
                  >
                    {{ row[head] }}
                  </div>
                </td>
                <td class="text-center td-custom">
                  {{ row.nom_hoja }}
                </td>
              </ng-container>
            </tr>
          </tbody>
        </table>
      </ng-container>
    </div>
  </ng-container>
  <app-cargando
    [bloquearTodo]="false"
    *ngIf="mostrar_carga_todo2"
  ></app-cargando>
</div>
<app-cargando [bloquearTodo]="true" *ngIf="mostrar_carga_todo"></app-cargando>

<app-modal-basic #modalEstilos [dialogClass]="'modal-lg'">
  <div class="app-modal-header">
    <h4 class="modal-title tit-modal1"><b>Estilos Tabla Hojas</b></h4>
    <button type="button" class="close basic-close" (click)="cerrarModal()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="app-modal-body">
    <div class="row">
      <div class="col-12">
        <table
          class="table-bordered tab-10 table-p table-custom"
          style="table-layout: fixed"
        >
          <thead class="text-center headsticky">
            <tr>
              <th appAnchocol [ancho]="100">Nivel</th>
              <th>Texto</th>
              <th appAnchocol [ancho]="100">TIPO</th>
              <th appAnchocol [ancho]="100">COLOR</th>
              <th appAnchocol [ancho]="100">ALINEAMIENTO</th>
              <th appAnchocol [ancho]="50">TAMAÑO</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Titulo</td>
              <td
                [style.color]="stilosTit.color + '!important'"
                [style.font-size]="stilosTit.size + 'px !important'"
                [style.text-align]="stilosTit.alineamiento + '!important'"
                [ngClass]="{
                  normal: stilosTit.tipo == '1',
                  cursiva: stilosTit.tipo == '2',
                  negrita: stilosTit.tipo == '3',
                  cursivanegrita: stilosTit.tipo == '4'
                }"
              >
                TITULO 1 EJEMPLO
              </td>
              <td class="text-center">
                <select
                  class="w-100"
                  [value]="stilosTit.tipo"
                  [ngClass]="{
                    normal: stilosTit.tipo == '1',
                    cursiva: stilosTit.tipo == '2',
                    negrita: stilosTit.tipo == '3',
                    cursivanegrita: stilosTit.tipo == '4'
                  }"
                  (change)="
                    cambiarcolor($event.target.value, 'stilosTit', 'tipo')
                  "
                >
                  <option
                    *ngFor="let tipletra of tipoletra"
                    [value]="tipletra.id"
                    [selected]="tipletra.id == stilosTit.tipo"
                    [ngClass]="{
                      normal: tipletra.id == '1',
                      cursiva: tipletra.id == '2',
                      negrita: tipletra.id == '3',
                      cursivanegrita: tipletra.id == '4'
                    }"
                  >
                    {{ tipletra.nombre }}
                  </option>
                </select>
              </td>
              <td class="text-center">
                <input
                  type="color"
                  [value]="stilosTit.color"
                  (change)="
                    cambiarcolor($event.target.value, 'stilosTit', 'color')
                  "
                />
              </td>
              <td>
                <select
                  class="w-100"
                  [value]="stilosTit.alineamiento"
                  [ngStyle]="{ 'text-align': stilosTit.alineamiento }"
                  (change)="
                    cambiarcolor(
                      $event.target.value,
                      'stilosTit',
                      'alineamiento'
                    )
                  "
                >
                  <option
                    *ngFor="let aline of alineamiento"
                    [value]="aline.id"
                    [selected]="aline.id == stilosTit.alineamiento"
                    [ngStyle]="{ 'text-align': aline.id }"
                  >
                    {{ aline.nombre }}
                  </option>
                </select>
              </td>
              <td>
                <select
                  class="w-100"
                  [value]="stilosTit.size"
                  [ngStyle]="{ 'text-align': stilosTit.size }"
                  (change)="
                    cambiarcolor($event.target.value, 'stilosTit', 'size')
                  "
                >
                  <option
                    *ngFor="let tamanio of tamanioletra"
                    [value]="tamanio.id"
                    [selected]="tamanio.id == stilosTit.size"
                    [ngStyle]="{ 'text-align': tamanio.id }"
                  >
                    {{ tamanio.nombre }}
                  </option>
