  <style>
    body {

    }

    .container {

    /* custom class */
    .gantt .bar-milestone .bar {
      fill: rgb(226 99 99);
    }

    .gantt .bar-milestone2 .bar {
      fill: #444446;
    }

    .gantt .bar-hito .bar {
      fill: #81b444;
      -webkit-clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }

    .gantt .bar-milestoneEta .bar {
      fill: #c4cd69
    }

    .gantt .bar-milestoneUni .bar {

    }

    .gantt .bar-milestoneSol .bar {

    .gantt .bar-milestoneMul .bar {

    .gantt .bar-milestoneMulH .bar {
      fill: #6666e6a1;
    }

    .gantt .grid-background {
      fill: none;
    }

    .gantt .grid-header {
      fill: #ffffff;
      stroke: #e0e0e0;
      stroke-width: 1.4;
    }

    .gantt .grid-row {
      fill: #ffffff;
    }

    .gantt .grid-row:nth-child(even) {

      fill: #ffffff;

    .gantt .row-line {
      stroke: #ebeff2;
    }

    .gantt .tick {

    }

    .gantt .tick.thick {

      stroke-width: 1;

      opacity: 0.5;

    }

    }

    .gantt .color_2 {
      fill: #ebbcf1;
      opacity: 0.5;
    }

    .gantt .color_3 {
      fill: #d4e4f4;
      opacity: 0.5;
    }

    .gantt .color_4 {
      fill: #ffd8d8;
      opacity: 0.5;
    }

    .gantt .color_5 {
      fill: #d5f9ba;
      opacity: 0.5;
    }

    .gantt .color_6 {
      fill: #ffdba3;
      opacity: 0.5;
    }

    .gantt .color_0 {
      fill: #f3f3f3;
      opacity: 0.5;
    }

    .gantt .arrow {
      fill: none;
      stroke: #666;
      stroke-width: 1.4;
    }

    .gantt .arrow2 {
      stroke-width: 1.1 !important;
    }

    .gantt .arrow3 {
      stroke-width: 0.9 !important;
    }


    .gantt .bar {
      fill: #3ca8ff;
      stroke: #8D99A6;
      stroke-width: 0;
      transition: stroke-width .3s ease;
      user-select: none;
    }

    .gantt .bar-progress {
      fill: #a3a3ff;
    }

    .gantt .bar-invalid {
      fill: transparent;
      stroke: #8D99A6;
      stroke-width: 1;
      stroke-dasharray: 5;
    }

    .gantt .bar-invalid~.bar-label {
      fill: #555;
    }

    .gantt .bar-label {
      fill: rgb(255, 255, 255);
      dominant-baseline: central;
      text-anchor: middle;
      font-size: 8px;
      font-weight: bolder;
    }

    .gantt .bar-label.big {
      fill: #555;
      text-anchor: start;
    }

    .gantt .handle {
      fill: #ddd;
      cursor: ew-resize;
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s ease;
    }

    .gantt .bar-wrapper {
      cursor: pointer;
      outline: none;
    }

    .gantt .bar-wrapper:hover .bar {
      /* fill: #a9b5c1; */
    }

    .gantt .bar-wrapper:hover .bar-progress {
      /* fill: #8a8aff; */
    }

    .gantt .bar-wrapper:hover .handle {
      visibility: visible;
      opacity: 1;
    }

    .gantt .bar-wrapper.active .bar {
      /* fill: #a9b5c1; */
    }

    .gantt .bar-wrapper.active .bar-progress {
      /* fill: #8a8aff; */
    }

    .gantt .lower-text,
    .gantt .upper-text {
      font-size: 9px;
      text-anchor: middle;
    }

    .gantt .upper-text {
      fill: #555 !important;
      font-size: 15px !important;
    }

    .gantt .lower-text {
      fill: #333 !important;
    }

    .gantt .hide {
      display: none;
    }

    .gantt-container {
      position: absolute;
      top: 5px;
      /* overflow: auto; //quitar overflow: libreria; */
      font-size: 9px;
    }

    .gantt-container .popup-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      background: rgb(40 35 35 / 91%);
      padding: 0;
      color: rgb(239, 245, 247);
      border-radius: 3px;
    }

    .gantt-container .popup-wrapper .title {
      border-bottom: 3px solid #ccd0d7;
      padding: 5px;
      font-weight: bolder;
      font-family: system-ui;
    }

    .gantt-container .popup-wrapper .subtitle {
      padding: 6px;
      color: rgb(239, 245, 247);
    }

    .gantt-container .popup-wrapper .pointer {
      position: absolute;
      height: 5px;
      margin: 0 0 0 -5px;
      border: 5px solid transparent;
      border-top-color: rgba(0, 0, 0, 0.8);
    }

    .contenido-principal-login {
      display: block;
      content: '';
      width: 40%;
      height: 100vh;
      background-color: #444446;
    }

    .contenido-principal-login::before {
      content: '';
      width: 60%;
      height: 100vh;
      background-color: #1212af;
    }
  </style>
