<div class="modal-dialog-scrollable">
    <div class="modal-content">
        <div class="app-modal-header  modal-header">
            <h4 class="modal-title tit-modal1">
                <b *ngIf="ver">Datos Proveedor</b>
                <b *ngIf="!ver && !editar">Agregar Proveedor</b>
                <b *ngIf="!ver && editar">Editar Proveedor</b>
            </h4>
            <button type="button" class="close basic-close" (click)="closeModal('click-close')">
                <span aria-hidden="true" class="mt-2">&times;</span>
            </button>
        </div>
        <div class="modal-body overflow-hidden">
            <form [formGroup]="formProveedor">
                <div class="row">
                    <div class="col-12 form-group mb-2">
                        <label >Activo :</label>
                        <div class="switch  d-inline m-r-10" style="margin-left: 10px;">
                            <input type="checkbox" id="switch-p-1" formControlName="estado">
                            <label for="switch-p-1" class="cr"></label>
                        </div>
                    </div>
                    <mat-form-field appearance="outline" class="mff-reduc col-sm-12 col-12">
                        <mat-label>RUC</mat-label>
                        <input matInput type="text" formControlName="nrodoc" [textMask]="{mask: this.formService.maskRuc}" autocomplete="off" maxlength="11"><!-- (keydown)="this.formService.limitarSoloNumerosEnteros($event)" -->
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="mff-reduc col-sm-12 col-12">
                        <mat-label>Razon Social</mat-label>
                        <textarea matInput autocomplete="off" class="mayuscula" maxlength="250" formControlName="nombre_razon"></textarea>
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="mff-reduc col-sm-6 col-12">
                        <mat-label>Dirección</mat-label>
                        <input matInput type="text" formControlName="direccion" autocomplete="off">
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="mff-reduc col-md-6 col-12">
                        <mat-label>Teléfono</mat-label>
                        <input matInput type="text" formControlName="telefono" [textMask]="{mask: this.formService.maskTelefono}" autocomplete="off" maxlength="11">
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="mff-reduc col-sm-6 col-12">
                        <mat-label>Correo</mat-label>
                        <input matInput type="text" formControlName="correo"  autocomplete="off">
                    </mat-form-field>
                    <!-- <div class="col-xl-4 col-sm-12 col-md-6"> -->
                        <mat-form-field appearance="outline" class="mff-reduc  col-sm-6 col-12 alto-35  col-sm-12 col-md-6">
                            <mat-label>Departamento</mat-label>
                            <select matNativeControl formControlName="id_departamento" >
                                <option value="">--Seleccionar--</option>
                            <option *ngFor="let departamento of departamentos" [value]="departamento.id_depart">
                                {{departamento.DEPARTAMENTO}}
                            </option>
                            </select>
                        </mat-form-field>
                    <!-- </div> -->
                </div>
            </form>
        </div>
        <div class="app-modal-footer modal-footer justify-content-between">
            <button type="button" class="btn btn-danger btn-sm" (click)="closeModal('cancelar')"><i
                    class="fa fa-times"></i>Cerrar</button>
            <button type="button" class="btn btn-success btn-sm" (click)="almacenar()" *ngIf="!ver"><i
                    class="fa fa-check"></i>Guardar</button>
        </div>
    </div>
</div>
<app-cargando [bloquearTodo]="true" *ngIf="mostrar_carga_todo"></app-cargando>
