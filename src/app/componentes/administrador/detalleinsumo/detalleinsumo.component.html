<div class="page-body">
    <div class="row">
        <div [ngClass]="{'col-lg-6 col-md-6 col-sm-12 col-12': (!expandirUnidad && !expandirIndice), 
                    'col-md-12 col-sm-12': (expandirIndice && !expandirUnidad),
                    'd-none': (expandirUnidad && !expandirIndice)}">
            <app-indice-unificado (cargaCompleta2)="this.cargando2 = $event" (expanded)="expandir($event, null)">
            </app-indice-unificado>
        </div>
        <div [ngClass]="{'col-lg-6 col-md-6 col-sm-12 col-12': (!expandirUnidad && !expandirIndice), 
        'col-md-12 col-sm-12': (!expandirIndice && expandirUnidad),
        'd-none': (!expandirUnidad && expandirIndice)}">
            <app-unidad-de-medida (cargaCompleta)="this.cargando = $event" (expanded)="expandir( null, $event)">
            </app-unidad-de-medida>
        </div>
    </div>

    <div class="theme-loader" *ngIf="cargando || cargando2">
        <div class="loader-track">
            <div class="loader-block">
                <svg id="loader2" viewBox="0 0 100 100">
                    <circle id="circle-loader2" cx="50" cy="50" r="45"></circle>
                </svg>
            </div>
        </div>
    </div>
</div>
