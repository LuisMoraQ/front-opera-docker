<div class="contenido-menu-responsive">
  <div class="contepri row mx-0 w-100">
    <div class="w-100 m-b-10 col-12" style="padding-left: 5px; padding-right: 5px;">
      <div class="tabla-limp tablast m-b-10" [style.margin-bottom.px]="-paddingscroll2" id="tableBody" (scroll)="SyncScroll()" style="min-height: 150px;" [style.height.px]="heighttmodal1">
          <table class="table-bordered tab-10 minspacelet">
            <thead>
              <tr class="header-custom">
                <th appAnchocol [ancho]="30">ITEM</th>
                <th appAnchocol [ancho]="200" [detalle]="true">DESCRIPCION</th>
                <th appAnchocol [ancho]="35">UND</th>
                <th appAnchocol [ancho]="90">CANT</th>
                <th appAnchocol [ancho]="100">MARCA</th>
                <th appAnchocol [ancho]="100">P.UNITARIO</th>
                <th appAnchocol [ancho]="100">IMPORTE</th>
              </tr>
            </thead>
            <tbody>
              <ng-container *ngIf="dataSourcePri.length>0">
                <tr *ngFor="let row of dataSourcePri;let indice=index;" (click)="cambindiceselSol(indice)" [ngClass]="{'highlight': filasol_sel == indice}" >
                  <td appAnchocol [ancho]="30"> 
                    {{indice+1}}
                  </td>
                  <td appAnchocol [ancho]="200" [detalle]="true" class="celdasalto text-left"> 
                    <span class="span-container" placement="top" ngbTooltip="{{row.descripcion}}" container="body">
                      <span class="span-ellipsis w-100 d-flex">
                        <span>{{row.descripcion}}</span> 
                      </span>
                    </span>
                  </td>
                  <td appAnchocol [ancho]="35">{{row.unidad}}</td>
                  <td appAnchocol [ancho]="90" class="text-right">
                      {{row.cantidad | number: mask_cant}}
                  </td>
                  <td appAnchocol [ancho]="100">
                      <span  class="w-100 span-container" placement="top" ngbTooltip="{{row.marca}}" container="body" ><!-- *ngIf="row.editar==0" [ngStyle]="{'cursor': 'pointer' }"  (click)="editarcelda3(row)" -->
                          <span class="span-ellipsis w-100 d-flex">
                              <span>{{row.marca}}</span> 
                          </span>
                      </span>
                      <!-- <input *ngIf="row.editar==1" type="text" class="formcontrol w-100 d-flex" style="height: 20px;" value="{{row.marca}}" appAutoFocus (keyup)="presenter3($event,indice)" (blur)="caneditarcelda3($event.target.value,row)"> -->
                  </td>
                  <td appAnchocol [ancho]="100" class="text-right">
                      <div class="float-right w-100"><!-- *ngIf="row.editar2==0" (click)="editarcelda2(indice)" style="cursor: pointer;" -->
                          <span class="float-left">{{simbolo}}</span>
                          <span class="float-right">{{row.precio | number: mask_precio}}</span>
                      </div >
                      <!-- <input [textMask]="dec_precio == 4? formService.maskUsAmountDecimal4 : (dec_precio==3? formService.maskUsAmountDecimal3:formService.maskUsAmountDecimal2)" style="height: 20px;text-align: center;" 
                      *ngIf="row.editar2==1" type="text" class="formcontrol w-100 d-flex" autocomplete="off"
                      value="{{row.precio}}" appAutoFocus (keyup)="presenter2($event,indice)" (blur)="caneditarcelda2($event.target.value,indice)"> -->
                  </td>
                  <td appAnchocol [ancho]="100" class="text-right">
                      <span class="float-left">{{simbolo}}</span>
                      <span class="float-right">{{row.parcial | number: mask_parcial}}</span>
                  </td>
                </tr>
              </ng-container>
              <ng-container *ngIf="dataSourcePri.length<=0">
                <tr>
                  <td class="mat-cell text-center" colspan="11">
                      <label *ngIf="!buscando2">No se encontraron resultados</label>
                      <div *ngIf="buscando2" class="preloader3 loader-block">
                          <div class="circ1"></div>
                          <div class="circ2"></div>
                          <div class="circ3"></div>
                          <div class="circ4"></div>
                      </div>
                  </td>
                </tr>
              </ng-container>
            </tbody>
          </table>
        </div>
        <div class="tare-footer footer-tabla tablast tabla-limp m-b-5" [style.padding-right.px]="paddingscroll" id="tableFoot" (scroll)="SyncScroll2()">
          <table class="table-bordered tab-10" style="position: sticky; bottom: 1px;">
              <tfoot>
              <tr>
                  <th style="min-width: 555px; max-width: 555px;width: calc(100% - 530px);">Total</th>
                  <th appAnchocol [ancho]="100" class="text-right">
                  {{rowtotal| number: mask_parcial}}
                  </th>
              </tr>
              </tfoot>
          </table>
        </div>
    </div>
  </div>
</div>

<app-cargando [bloquearTodo]="true" *ngIf="mostrar_carga_todo"></app-cargando>
