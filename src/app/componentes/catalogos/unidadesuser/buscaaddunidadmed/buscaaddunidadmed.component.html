<div class="modal-dialog-scrollable modal-lg">
  <div class="modal-content">
    <div class="app-modal-header  modal-header">
      <!-- tipo modal es la accion de para el modal actualizar o guardar -->
      <h4 class="modal-title tit-modal1">
        <b>Lista de Unidades de Medida</b>
      </h4>
      <button type="button" class="close basic-close" (click)="closeModal()">
        <span aria-hidden="true" class="mt-2">&times;</span>
      </button>
    </div>
    <div class="modal-body">
      <div class="row justify-content-between p-r-15">
        <div class="col-sm-5 col-md-5" style="margin-bottom: 10px;">
          <mat-form-field class="mff-reduc w-100 alto-35 field-busqueda" appearance="outline">
            <mat-label>Buscar</mat-label>
            <input matInput type="text" [(ngModel)]="busqueda" (keyup)="applyFilterPrinc($event)" autocomplete="off" id="inpbusq">
            <button *ngIf="busqueda" matSuffix mat-icon-button aria-label="Clear" (click)="limpiarfiltro()">
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
        </div>
        <button type="button" class="btn btn-success btn-sm light ripple m-b-10 m-r-5" (click)="openNuevo()"
          (mouseup)="quitarfoco($event);">
          <i class="fa fa-plus"></i>Agregar Unidad de Medida
        </button>
        <!-- agregar boton para agregar nuevo -->
      </div>
      <div class="table-responsive height-tabla">
        <table #table1 class="tabla-general" mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
          <ng-container matColumnDef="indice">
            <th mat-header-cell *matHeaderCellDef mat-sort-header appAnchocol [ancho]="55">ID</th>
            <td mat-cell *matCellDef="let row;let ind = dataIndex;" appAnchocol [ancho]="55"> {{ind+1}} </td>
          </ng-container>
          <ng-container matColumnDef="unidad">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Unidad</th>
            <td mat-cell *matCellDef="let row" class="text-left"> {{row.unidad}} </td>
          </ng-container>
          <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripcion</th>
            <td mat-cell *matCellDef="let row" class="text-left"> {{row.descripcion}} </td>
          </ng-container>
          <ng-container matColumnDef="activo">
            <th mat-header-cell *matHeaderCellDef appAnchocol [ancho]="155">Activo</th>
            <td mat-cell *matCellDef="let row">
              <div class="label-main" *ngIf="row.id_cargo!=''" style="margin: 1px;">
                <label *ngIf="row.activo=='1'" class="label label-success ancho-50p">Activo</label>
                <label *ngIf="row.activo=='0'" class="label label-danger">Inactivo</label>
              </div>
            </td>
          </ng-container>
          <tr mat-header-row class="header-custom" *matHeaderRowDef="displayedColumn; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; let i = dataIndex; columns: displayedColumn;"
            [ngClass]="{'highlight': fila_sel == i}" (click)="cambindicesel(i, row)" (dblclick)="seleccionar(row)"></tr>

          <tr *matNoDataRow class="nodata">
            <td class="mat-cell text-center" colspan="11">
              <label *ngIf="!buscando">No se encontraron resultados</label>
              <div *ngIf="buscando" class="preloader3 loader-block">
                <div class="circ1"></div>
                <div class="circ2"></div>
                <div class="circ3"></div>
                <div class="circ4"></div>
              </div>
            </td>
          </tr>
        </table>
      </div>
    </div>
    <div class="app-modal-footer modal-footer justify-content-between">
      <button type="button" class="btn btn-danger btn-sm" (click)="closeModal()"><i
          class="fa fa-times"></i>Cerrar</button>
      <button type="button" class="btn btn-success btn-sm" (click)="seleccionar()"><i
          class="fa fa-check"></i>Seleccionar</button>
    </div>
  </div>
</div>
