<div class="modal-dialog-scrollable modal-md">
  <div class="modal-content">
      <div class="app-modal-header  modal-header">
          <h4 class="modal-title tit-modal1">
              <b>{{titmodal}}</b>
          </h4>
          <button type="button" class="close basic-close" (click)="closeModal('')">
              <span aria-hidden="true" class="mt-2">&times;</span>
          </button>
      </div>
      <div class="modal-body">
        <form [formGroup]="formAgrega">
            <div class="row">
                <mat-form-field appearance="outline" class="mff-reduc col-sm-12 col-12">
                    <mat-label>Titulo</mat-label>
                    <input matInput id="descrip" class="mayuscula" autocomplete="off" maxlength="250" formControlName="titulo" (keyup)="keyaction($event)">
                </mat-form-field>
            </div>
        </form>
      </div>
      <div class="app-modal-footer modal-footer justify-content-between">
          <button type="button" class="btn btn-danger btn-sm" (click)="closeModal('')"><i
                  class="fa fa-times"></i>Cerrar</button>
          <button type="button" class="btn btn-success btn-sm" (click)="Guardar()"><i
                  class="fa fa-check"></i>Agregar</button>
      </div>
  </div>
</div>
